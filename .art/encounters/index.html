    const x = c.getContext('2d'); x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, im.width, im.height).data, px = [];
    for (let i = 0; i < d.length; i += 4) px.push(d[i + 3] > 128 ? [d[i], d[i + 1], d[i + 2]] : null);
    SPR[id] = { w: im.width, h: im.height, px }; if (lastIds && lastIds.includes(id)) place(lastIds); };
  im.src = 'data:image/png;base64,' + b64;
}
// where loose things can sit in each scene (bottom-centre), and how the scene's light tints them
const SLOTS = { trunk: [[30, 134], [77, 128], [54, 151]], diner: [[17, 130], [43, 123], [99, 142]], store: [[28, 108], [75, 70], [52, 95]],
  botika: [[30, 100], [68, 100], [45, 160]], kwik: [[80, 106], [36, 158], [66, 166]], kainan: [[30, 113], [78, 121], [42, 160]] };
const TINT = { trunk: [0.9, 0.84, 0.84], diner: [0.92, 0.96, 0.9], store: [0.6, 0.88, 0.64], botika: [0.6, 0.72, 0.95], kwik: [0.78, 0.82, 0.86], kainan: [0.98, 0.8, 0.6] };
const DEFAULT = { trunk: ['sledge', 'flares', 'jerrycan'], diner: ['water', 'butane', 'beef'], store: ['sardines', 'meds', 'batteries'],
  botika: ['bandage', 'antibiotics', 'vitamins'], kwik: ['noodles', 'tuna', 'matches'], kainan: ['tuyo', 'kaldero', 'eggs'] };
let placed = {};                                                                                // id → { box: [x0, y0, x1, y1], spr }
function place(ids) {
  placed = {}; lastIds = ids;
  if (scene === 'car') { placed.trunk = { box: [8, 122, 102, 170] }; return; }                   // the car itself is the thing to tap
  (ids || []).forEach((id, i) => { const sl = (SLOTS[scene] || [])[i], sp = SPR[id]; if (!sl || !sp) return;
    const x0 = Math.round(sl[0] - sp.w / 2), y0 = sl[1] - sp.h; placed[id] = { box: [x0, y0, x0 + sp.w - 1, y0 + sp.h - 1], spr: sp }; });
}
let glow = null, hov = null, alarm = false, live = !params.has('embed') || params.has('live');   // embedded, the map says when tapping counts
const mid = ([x0, y0, x1, y1]) => [Math.round((x0 + x1) / 2), Math.round((y0 + y1) / 2)];
const taken = new Set();                                                                        // everything Juan has carried out: gone from the scene (any number of things)
function glints(T) {
  if (alarm) return;
  const tint = TINT[scene] || [1, 1, 1];
  for (const [id, { box, spr }] of Object.entries(placed)) {
    if (taken.has(id)) continue;                                                                // Juan has it: gone from the scene
    if (spr) for (let y = 0; y < spr.h; y++) for (let x = 0; x < spr.w; x++) if (spr.px[y * spr.w + x]) mix(box[0] + x + 1, box[1] + y + 2, [8, 6, 8], 0.45);   // hard contact shadow
    if (spr) for (let y = 0; y < spr.h; y++) for (let x = 0; x < spr.w; x++) { const c = spr.px[y * spr.w + x]; if (c) mix(box[0] + x, box[1] + y, c.map((v, j) => v * tint[j]), 1); }
    const [x, y] = spr ? [box[2] - 1, box[1] + 1] : mid(box), on = id === glow, ph = Math.sin(T * 3 + x * 0.3);
    const k = on ? 0.95 : 0.5 + 0.35 * Math.max(0, ph), arm = on ? 2 : ph > 0 ? 1 : 0;
    mix(x, y, [255, 214, 140], k);
    for (let a = 1; a <= arm; a++) for (const [dx, dy] of [[a, 0], [-a, 0], [0, a], [0, -a]]) mix(x + dx, y + dy, [240, 166, 60], k * (1 - a * 0.3));
    if (on || id === hov) {                                                                     // brackets on the thing's corners: solid when picked, faint on hover
      const [x0, y0, x1, y1] = box.map((v, i) => v + (i < 2 ? -2 : 2)), c = on ? 0.95 : 0.5;
      for (const [cx, cy, sx, sy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]])
        for (let n = 0; n < 3; n++) { mix(cx + sx * n, cy, [240, 166, 60], c); mix(cx, cy + sy * n, [240, 166, 60], c); }
    }
  }
}
function itemAt(e) {
  if (!live || alarm) return null;
  const b = cv.getBoundingClientRect(), x = (e.clientX - b.left) / b.width * W, y = (e.clientY - b.top) / b.height * H;
  return Object.keys(placed).find(id => { if (taken.has(id)) return false; const [x0, y0, x1, y1] = placed[id].box; return x >= x0 - 2 && x <= x1 + 2 && y >= y0 - 2 && y <= y1 + 2; }) || null;
}
const tell = m => parent !== window && parent.postMessage(Object.assign({ pauwi: 'scene' }, m), '*');
cv.onpointermove = e => { const id = itemAt(e); cv.style.cursor = id ? 'pointer' : ''; if (id !== hov) { hov = id; tell({ hover: id }); } };
cv.onpointerleave = () => { if (hov) { hov = null; tell({ hover: null }); } };
cv.onclick = e => { const id = itemAt(e); if (!id) return; if (id === glow) { tell({ take: id }); if (parent === window) taken.add(id); } else { glow = id; tell({ pick: id }); } };   // first tap looks, second takes

// ---------- the diner, lights still on for nobody ----------
function diner(T, dt) {
  const B = BASE.diner; out.set(B);
  const tube = rnd() < 0.06 ? 0.55 : 1;                                                        // the front panel stutters
  for (let y = 10; y < 30; y++) for (let x = 36; x < 70; x++) { const i = at(x, y); if (out[i + 1] > 150) for (let j = 0; j < 3; j++) out[i + j] *= tube; }
  const neon = 0.8 + 0.2 * Math.sin(T * 2.1) * (Math.floor(T * 5) % 9 === 0 ? -1 : 1);           // the pink sign over the door
  for (let y = 78; y < 96; y++) for (let x = 54; x < 80; x++) { const i = at(x, y); if (out[i] > out[i + 1] + 25) { out[i] = clamp(out[i] * neon * 1.1, 0, 255); out[i + 2] = clamp(out[i + 2] * neon, 0, 255); } }
  for (let y = 150; y < 200; y++) for (let x = 50; x < 80; x++) { const i = at(x, y); if (out[i] > 150) out[i] = clamp(out[i] * (0.9 + neon * 0.12), 0, 255); }   // its smear on the wet tiles
  glints(T);
}

// ---------- the convenience store, one tube still humming ----------
function store(T, dt) {
  const B = BASE.store; out.set(B);
  const hum = 0.94 + 0.06 * Math.sin(T * 40) - (rnd() < 0.04 ? 0.3 : 0);
  for (let y = 0; y < 22; y++) for (let x = 0; x < W; x++) { const i = at(x, y); if (out[i + 1] > 170) for (let j = 0; j < 3; j++) out[i + j] *= hum; }
  for (let y = 140; y < 190; y++) for (let x = 10; x < 70; x++) { const i = at(x, y); out[i + 1] = clamp(out[i + 1] * (0.97 + hum * 0.03), 0, 255); }   // the light pool on the floor breathes with it
  glints(T);
}

// the car alarm: hazards strobing, headlights flaring, the whole street lit up red
function alarmed(T, dt) {
  car(T, dt);
  const on = Math.floor(T / 0.18) % 2 === 0, red = Math.floor(T / 0.36) % 2 === 0;               // hazards strobing, the whole street lit red
  for (const [x, y] of TAIL) { glowAt(x, y, on ? 12 : 5, [160, 80, 16], on ? 1 : 0.2); glowAt(x, y + 24, 9, [120, 60, 10], on ? 0.8 : 0.1, 2.4); }
  for (let i = 0; i < out.length; i += 4) { out[i] = clamp(out[i] * (red ? 1.22 : 1.05), 0, 255); out[i + 1] *= red ? 0.82 : 0.95; out[i + 2] *= red ? 0.82 : 0.95; }
}

// ---------- the botika: one blue exit sign still on its battery ----------
function botika(T, dt) {
  out.set(BASE.botika);
  const exit = 0.75 + 0.25 * Math.sin(T * 2.2) - (rnd() < 0.05 ? 0.5 : 0);
  glowAt(96, 28, 14, [20, 50, 110], exit); glowAt(60, 13, 30, [10, 20, 36], rnd() < 0.08 ? 1 : 0);   // and a dead tube that sparks now and then
  glints(T);
}
// ---------- the Kwik Mart: the last tube, flickering ----------
function kwik(T, dt) {
  out.set(BASE.kwik);
  const tube = rnd() < 0.1 ? 0.2 : 0.9 + 0.1 * Math.sin(T * 50);
  for (let y = 10; y < 40; y++) for (let x = 50; x < 80; x++) { const i = at(x, y); if (out[i] + out[i + 1] > 300) for (let j = 0; j < 3; j++) out[i + j] *= tube; }
  glowAt(64, 40, 40, [22, 26, 28], tube - 0.4, 1.4);
  glints(T);
}
// ---------- the kainan: a candle burning down on the counter ----------
function kainan(T, dt) {
  out.set(BASE.kainan);
  const fl = 0.8 + 0.12 * Math.sin(T * 13) + 0.08 * Math.sin(T * 31.7) + (rnd() - 0.5) * 0.1;
  glowAt(57, 147, 34, [60, 34, 8], fl, 0.8); mix(57, 144, [255, 220, 140], 0.6 * fl); mix(57, 143, [255, 200, 120], 0.4 * fl);
  glints(T);
}
// ---------- Nida's: the lamp is on, the rain is outside ----------
const ndrops = Array.from({ length: 30 }, () => ({ x: rnd() * W, y: rnd() * H, v: 140 + rnd() * 60 }));
function nida(T, dt) {
  out.set(BASE.nida);
  const fl = 0.85 + 0.08 * Math.sin(T * 9) + 0.05 * Math.sin(T * 23.3);
  glowAt(73, 112, 30, [44, 26, 6], fl);
  for (const d of ndrops) { d.y += d.v * dt; if (d.y > H) { d.y = -4; d.x = rnd() * W; }               // rain past the doorway, in the dark at the edges
    if (d.y > 190 || d.x < 4) for (let k = 0; k < 3; k++) add(d.x, d.y - k, 18, 20, 26); }
}

// ---------- the other shelters: one warm light each, breathing ----------
const shelter = (key, x, y, rad, col) => function (T, dt) {
  out.set(BASE[key]);
  const fl = 0.82 + 0.1 * Math.sin(T * 9 + x) + 0.06 * Math.sin(T * 23.3) + (rnd() - 0.5) * 0.06;
  glowAt(x, y, rad, col, fl);
};
// Tenement 10: the candle on the crate gutters, and rain streams past the barred window (only on the night behind the bars)
const t10drops = Array.from({ length: 46 }, () => ({ x: 42 + rnd() * 56, y: 10 + rnd() * 118, v: 70 + rnd() * 50 }));
let t10flash = 0;
function t10(T, dt) {
  out.set(BASE.t10);
  const sky = (i) => out[i + 2] > out[i] + 8 && out[i + 2] > 40;                       // a window pixel: the blue night, not a bar or the frame
  if (rnd() < dt * 0.06) t10flash = 0.35;                                            // now and then, far-off lightning over the rooftops
  if (t10flash > 0) { for (let y = 10; y < 128; y++) for (let x = 42; x < 98; x++) { const i = at(x, y); if (sky(i)) { out[i] += 60 * t10flash; out[i + 1] += 64 * t10flash; out[i + 2] += 80 * t10flash; } } t10flash -= dt * 1.4; }
  for (const d of t10drops) {                                                          // rain past the glass
    d.y += d.v * dt; d.x -= d.v * 0.08 * dt; if (d.y > 128) { d.y = 10; d.x = 42 + rnd() * 56; }
    for (let k = 0; k < 3; k++) { const x = Math.round(d.x), y = Math.round(d.y) - k; if (x < 42 || x > 97 || y < 10) continue; const i = at(x, y); if (sky(i)) { out[i] += 34 - k * 8; out[i + 1] += 38 - k * 8; out[i + 2] += 48 - k * 10; } }
  }
  const fl = 0.7 + 0.18 * Math.sin(T * 11) + 0.1 * Math.sin(T * 27.7) + (rnd() - 0.5) * 0.22;   // the candle: it gutters
  glowAt(43, 153, 32, [60, 34, 8], fl); glowAt(43, 150, 4, [120, 90, 40], fl);
  mix(43 + (rnd() < 0.3 ? (rnd() < 0.5 ? -1 : 1) : 0), 148, [255, 226, 150], 0.5 + 0.4 * fl);   // the flame itself, leaning in the draught
}
const brgy = shelter('brgy', 33, 138, 30, [46, 34, 12]);   // the battery lamp on the desk
const mm = shelter('mm', 73, 106, 34, [50, 34, 10]);       // the bulb on the car battery

// ---------- Aling Cora's stall under the train line: the lantern flickers, the rain comes down past the tarp ----------
const sdrops = Array.from({ length: 40 }, () => ({ x: rnd() * W, y: rnd() * H, v: 120 + rnd() * 60 }));
function suki(T, dt) {
  out.set(BASE.suki);
  const fl = 0.8 + 0.1 * Math.sin(T * 9) + 0.06 * Math.sin(T * 23.3) + (rnd() - 0.5) * 0.08;
  glowAt(50, 98, 34, [48, 30, 8], fl);
  for (const d of sdrops) { d.y += d.v * dt; d.x -= d.v * 0.05 * dt; if (d.y > H) { d.y = -4; d.x = rnd() * W; }
    if (d.y < 60 || d.x > 88 || d.y > 170) for (let k = 0; k < 3; k++) add(d.x, d.y - k, 16, 18, 24); }   // not under the tarp
}

const SCENES = { backpack, radio, car, trunk, diner, store, botika, kwik, kainan, nida, t10, brgy, mm, suki };
addEventListener('message', e => {                                                            // the map steers the scene: highlight, take, alarm
  const m = e.data || {};
  if ('scene' in m && m.scene in SCENES) { scene = m.scene; glow = hov = null; taken.clear(); alarm = false; place(m.items); }
  else if ('items' in m) place(m.items);
  if ('live' in m) live = m.live;
  if ('glow' in m) glow = m.glow;
  if ('taken' in m) { if (m.taken) taken.add(m.taken); else taken.clear(); }
  if ('untake' in m && m.untake) { taken.delete(m.untake); if (glow === m.untake) glow = null; }       // put back: it's in the scene again
  if ('alarm' in m) alarm = m.alarm;
});
let last = performance.now(), T = 0, acc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  if (acc >= 1 / 12 && BASE[scene]) { T += acc; (scene === 'car' && alarm ? alarmed : SCENES[scene])(T, acc); ctx.putImageData(img, 0, 0); acc = 0; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.querySelectorAll('[data-s]').forEach(b => { b.setAttribute('aria-pressed', b.dataset.s === scene);
  b.onclick = () => { scene = b.dataset.s; glow = hov = null; taken.clear(); place(DEFAULT[scene]); document.querySelectorAll('[data-s]').forEach(o => o.setAttribute('aria-pressed', o === b)); }; });
place(params.get('items') ? params.get('items').split(',') : params.has('embed') ? null : DEFAULT[scene]);   // embedded: the map says what's lying around
document.getElementById('alarmBtn').onclick = e => { alarm = !alarm; e.target.setAttribute('aria-pressed', alarm); if (alarm) document.querySelector('[data-s="car"]').click(); };
})();
</script>
