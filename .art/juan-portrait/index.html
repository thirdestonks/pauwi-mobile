<style>
  :root { --ink:#0E1214; --amber:#F0A63C; --bone:#ECE4D5; --slate:#828B90; --red:#D94B3B; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--ink); color:var(--bone); font:13px/1.4 ui-monospace, Consolas, monospace;
         display:flex; flex-direction:column; align-items:center; gap:22px; padding:28px 16px; }
  h1 { margin:0; font:800 26px/1 "Arial Narrow", Impact, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--amber); }
  .row { display:flex; gap:28px; flex-wrap:wrap; justify-content:center; align-items:flex-end; }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
  figcaption { color:var(--slate); letter-spacing:.2em; text-transform:uppercase; font-size:11px; }
  canvas { image-rendering:pixelated; display:block; }
  .hud { position:relative; padding:4px; background:#060707; border:2px solid #2b2f31; box-shadow:3px 3px 0 #000; }
  .hud.hit { animation: shake .18s steps(3) 1; }
  @keyframes shake { 33% { transform:translate(-3px,1px); } 66% { transform:translate(3px,-1px); } }
  .bar { height:8px; background:#1a1d1e; margin-top:6px; border:1px solid #2b2f31; }
  .bar i { display:block; height:100%; background:var(--red); transition:width .2s steps(4); }
  .controls { display:flex; gap:8px; }
  button { background:#141819; color:var(--bone); border:1px solid #2b3335; padding:8px 14px; font:inherit; cursor:pointer; letter-spacing:.1em; }
  button:hover { border-color:var(--amber); color:var(--amber); }
</style>

const NAMES = ['idle', 'breathe', 'blink', 'hurt', 'hurt-flash', 'dead'];
const live = document.getElementById('live').getContext('2d');
let state = 'idle', hp = 100, hurtUntil = 0, flashUntil = 0, nextBlink = 2500;
function frameIndex(t) {
  if (state === 'dead') return 5;
  if (t < flashUntil) return 4;
  if (t < hurtUntil) return 3;
  if (t > nextBlink && t < nextBlink + 130) return 2;
  if (t >= nextBlink + 130) nextBlink = t + 2200 + Math.random() * 3200;
  return Math.floor(t / 1300) % 2;                     // slow breathing
}
function draw(t) {
  live.clearRect(0, 0, 48, 56);
  live.drawImage(sheet, frameIndex(t) * 48, 0, 48, 56, 0, 0, 48, 56);
  requestAnimationFrame(draw);
}
sheet.onload = () => {
  requestAnimationFrame(draw);
  const row = document.getElementById('frames');
  NAMES.forEach((n, i) => {
    const f = document.createElement('figure'), c = document.createElement('canvas');
    c.width = 48; c.height = 56; c.style.width = '144px'; c.style.height = '168px';
    c.getContext('2d').drawImage(sheet, i * 48, 0, 48, 56, 0, 0, 48, 56);
    const cap = document.createElement('figcaption'); cap.textContent = n;
    f.append(c, cap); row.append(f);
  });
};
const hud = document.getElementById('hud'), bar = document.getElementById('hp');
document.getElementById('hit').onclick = () => {
  if (state === 'dead') return;
  const t = performance.now(); flashUntil = t + 90; hurtUntil = t + 1000;
  hp = Math.max(0, hp - 25); bar.style.width = hp + '%';
  hud.classList.remove('hit'); void hud.offsetWidth; hud.classList.add('hit');
  if (hp === 0) setTimeout(() => state = 'dead', 1000);
};
document.getElementById('die').onclick = () => { state = 'dead'; hp = 0; bar.style.width = '0%'; };
document.getElementById('reset').onclick = () => { state = 'idle'; hp = 100; bar.style.width = '100%'; hurtUntil = flashUntil = 0; };
</script>
