      if (RIM[i]) { R[i] += 16; G[i] += 18; B[i] += 20; }
    }
    // 4. a car now and then on the wet road, headlights smeared on the asphalt
    if (car) {
      const q = car.t / car.dur, x = 72 - q * 86, y = 147 + q * 30, size = 1 + Math.round(q * 2);
      for (let k = 0; k < size; k++) for (const ox of [0, 3 + size]) {
        const px = Math.round(x + ox + k), py = Math.round(y);
        if (px >= 0 && px < W && py >= 0 && py < H) { const i = py * W + px; R[i] = 250; G[i] = 238; B[i] = 200; }
        for (let s = 1; s < 10 + q * 12; s++) {                                               // reflection streak
          const ry = py + s, ix = px; if (ry >= H || ix < 0 || ix >= W) break;
          const i = ry * W + ix; if (!GND[i]) continue;
          const f = 0.35 * (1 - s / (10 + q * 12));
          R[i] += (250 - R[i]) * f; G[i] += (225 - G[i]) * f; B[i] += (170 - B[i]) * f;
        }
      }
    }
    // 5. drizzle, splashes, ripples, drips
    for (const l of layers) for (const p of l.p) {
      for (let s = 0; s < l.len; s++) {
        const x = Math.round(p.x - s * l.wind), y = Math.round(p.y - s);
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const i = y * W + x, a = l.alpha * (1 - s / (l.len + 1));
        R[i] += (200 - R[i]) * a; G[i] += (210 - G[i]) * a; B[i] += (218 - B[i]) * a;
      }
    }
    for (const r of ripples) {
      const q = r.age / r.life, rad = 0.6 + q * r.max, a = 0.28 * (1 - q);
      for (let ang = 0; ang < 6.28; ang += 0.45) {
        const x = Math.round(r.x + Math.cos(ang) * rad), y = Math.round(r.y + Math.sin(ang) * rad * 0.35);
        if (x < 0 || y < 0 || x >= W || y >= H || PUD[y * W + x] < 0.4) continue;
        const i = y * W + x; R[i] += (190 - R[i]) * a; G[i] += (200 - G[i]) * a; B[i] += (205 - B[i]) * a;
      }
    }
    for (const s of splashes) {
      const a = 0.35 * (1 - s.age / 0.15);
      for (const [dx, dy] of s.big ? [[0, 0], [-1, -1], [1, -1]] : [[0, 0]]) {
        const x = s.x + dx, y = s.y + dy; if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const i = y * W + x; R[i] += (200 - R[i]) * a; G[i] += (208 - G[i]) * a; B[i] += (214 - B[i]) * a;
      }
    }
    for (const d of drips) {
      const x = Math.round(d.x), y = Math.round(d.y); if (y < 0 || y >= H) continue;
      const i = y * W + x; R[i] += (215 - R[i]) * 0.45; G[i] += (222 - G[i]) * 0.45; B[i] += (228 - B[i]) * 0.45;
    }
    // 6. low mist drifting along the base of the building
    for (let y = 110; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const m = 0.16 * Math.exp(-(((y - 140) / 16) ** 2)) * clamp((vnoise(x * 0.03 - T * 0.05, y * 0.08, 20) - 0.35) * 2, 0, 1);
      R[i] += (150 - R[i]) * m; G[i] += (158 - G[i]) * m; B[i] += (162 - B[i]) * m;
    }
    // out, with a whisper of ordered dither so gradients stay pixel-crisp
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, o = i * 4, d = BAYER[y & 3][x & 3] * 3;
      out[o] = clamp(R[i] + d, 0, 255); out[o + 1] = clamp(G[i] + d, 0, 255); out[o + 2] = clamp(B[i] + d, 0, 255); out[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  function step(dt) {
    for (const l of layers) for (const p of l.p) {
      p.y += l.speed * p.v * dt; p.x -= l.speed * p.v * l.wind * dt;
      if (p.y > H + 4 || p.x < -6) { p.y = -4 - rnd() * 30; p.x = rnd() * (W + 40); }
    }
    let n = dt * 30;
    while (n > 0 && ripples.length < 40) {
      if (n < 1 && rnd() > n) break; n--;
      const i = PUDPIX[Math.floor(rnd() * PUDPIX.length)]; if (i === undefined) break;
      const y = Math.floor(i / W);
      ripples.push({ x: i % W, y, age: 0, life: 0.5 + rnd() * 0.35, max: 1.2 + (y - 140) / 22 });
    }
    n = dt * 26;
    while (n > 0) {
      if (n < 1 && rnd() > n) break; n--;
      const i = GNDPIX[Math.floor(rnd() * GNDPIX.length)]; if (i === undefined || PUD[i] > 0.4) continue;
      splashes.push({ x: i % W, y: Math.floor(i / W), age: 0, big: rnd() < 0.2 });
    }
    if (dripFrom.length && rnd() < dt * 2.2) { const [x, y] = dripFrom[Math.floor(rnd() * dripFrom.length)]; drips.push({ x, y, v: 0, wait: 0.3 + rnd() * 0.6 }); }
    for (let k = ripples.length - 1; k >= 0; k--) if ((ripples[k].age += dt) > ripples[k].life) ripples.splice(k, 1);
    for (let k = splashes.length - 1; k >= 0; k--) if ((splashes[k].age += dt) > 0.15) splashes.splice(k, 1);
    for (let k = drips.length - 1; k >= 0; k--) {
      const d = drips[k];
      if (d.wait > 0) { d.wait -= dt; continue; }                                            // bead forms, then lets go
      d.v += 140 * dt; d.y += d.v * dt;
      const i = Math.round(d.y) * W + Math.round(d.x);
      if (d.y >= H || (i >= 0 && i < N && (GND[i] || (d.y > 150)))) { if (d.y < H) splashes.push({ x: Math.round(d.x), y: Math.round(d.y), age: 0, big: true }); drips.splice(k, 1); }
    }
    if (car) { car.t += dt; if (car.t > car.dur) car = null; }
    else if ((nextCar -= dt) < 0) { car = { t: 0, dur: 3.5 + rnd() * 1.5 }; nextCar = 14 + rnd() * 20; }
  }

  let T = 0, last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.25, (now - last) / 1000); last = now; acc += dt;
    if (acc >= 1 / FPS) { step(acc); T += acc; frame(T, acc); acc = 0; }
    requestAnimationFrame(loop);
  }
  frame(0, 0);
  requestAnimationFrame(loop);
});
})();
</script>
