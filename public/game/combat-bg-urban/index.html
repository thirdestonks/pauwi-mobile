<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat BG — Urban</title>
<style>
  :root { --ink:#0E1214; --amber:#F0A63C; --bone:#ECE4D5; --slate:#828B90; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--ink); color:var(--bone);
         font:13px/1.4 ui-monospace, Consolas, monospace; display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px; }
  h1 { margin:0; font:700 15px/1 ui-monospace, Consolas, monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); }
  .frame { height:min(900px, calc(100vh - 150px)); aspect-ratio:110/225; background:#000; outline:1px solid #23302c; }
  .frame.native { height:auto; aspect-ratio:auto; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
  .frame.native canvas { width:110px; height:225px; }
  .frame.x2 canvas { width:220px; height:450px; }
  .controls { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:480px; }
  button, a.btn { background:#141a19; color:var(--bone); border:1px solid #2a3533; padding:6px 10px; font:inherit; cursor:pointer; text-decoration:none; }
  button[aria-pressed="true"], a.btn[aria-current="true"] { border-color:var(--amber); color:var(--amber); }
  p.note { color:var(--slate); max-width:460px; margin:0; text-align:center; }
  .embed { padding:0; gap:0; justify-content:center; overflow:hidden; }
  .embed h1, .embed .controls, .embed p.note { display:none; }
  .embed .frame { height:100vh; outline:none; }
</style>
</head>
<body>
<h1>Combat BG · Urban street</h1>
<div class="controls">
  <a class="btn" href="?mode=day" id="m-day">Day</a>
  <a class="btn" href="?mode=night" id="m-night">Night</a>
  <button id="play" aria-pressed="true">Playing</button>
  <button data-speed="1" aria-pressed="true">Speed 1×</button>
  <button data-speed="4" aria-pressed="false">Speed 4×</button>
  <button id="rain" aria-pressed="false">Rain</button>
  <button data-scale="fit" aria-pressed="true">Fit (4×)</button>
  <button data-scale="x2" aria-pressed="false">2×</button>
  <button data-scale="native" aria-pressed="false">Native 1×</button>
</div>
<div class="frame" id="frame"><canvas id="c" width="110" height="225"></canvas></div>
<p class="note">A Tondo street corner raycast at native 110×225. Day uses the fog palette and Night uses sodium light with the pharmacy's green glow. Rain works in both.</p>

<script>
const params = new URLSearchParams(location.search);
if (params.has('embed')) document.body.classList.add('embed');
(() => {
const NIGHT = params.get('mode') !== 'day';
document.getElementById(NIGHT ? 'm-night' : 'm-day').setAttribute('aria-current', 'true');
document.querySelector('h1').textContent = 'Combat BG · Urban ' + (NIGHT ? 'night' : 'day');

const W = 110, H = 225, CX = 55, CY = 128, F = 58;
const CAMX = -1.5;                                // camera stands in the middle of the road, facing straight down it
const EYE = 1.6, ROAD = -EYE, WALK = -EYE + 0.15;

// ---------- noise ----------
function hash(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fr = v => v - Math.floor(v);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let seed = 23;
const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) | 0, (seed >>> 0) / 4294967296);

// ---------- palettes ----------
const hex = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
const PAL = (NIGHT
  ? ['010203','05080a','0a1414','10201e','18302c','24403a','0b0b1c','14172e','21244a','363c6c','5a6a90',
     '1f1a2c','372c42','57434c','6f4f49','8a5f50','b8875f','d6a466','f0c67a','ffe4a6','fff6dc',
     '3a1c14','5e2c1a','8a3e22','c25a2c','e88a44','0f2a22','1a4a38','2f7a58','5cc08a','b0f0c8',
     'd83a2e','e8ecf0','9fb8e0','4a5a3a','6e7a48']
  : ['1b2622','212e29','283832','2f3f39','374a44','3f534c','465b54','4e645d','566c65','5e756d','657c74','6c827a','75897f',
     '7e928a','8a9c94','3f6e57','5c9a78','8ec8a4','8a4a3e','b55a48','a89050','d0b060']).map(hex);
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r => r.map(v => (v + .5) / 16 - .5));

// ---------- scene: axis-aligned boxes ----------
const boxes = [];
const box = (x0, y0, z0, x1, y1, z1, mat, extra = {}) => boxes.push({ lo: [x0, y0, z0], hi: [x1, y1, z1], mat, ...extra });

box(-60, -9, -5, 60, ROAD, 200, 'road');
box(-6.0, -9, -5, -4.5, WALK, 70, 'walk', { side: 'L' });
box(1.5, -9, -5, 5.2, WALK, 70, 'walk', { side: 'R' });
box(5.2, -9, -5, 40, WALK - 0.05, 70, 'lot');
box(5.2, WALK, 0, 5.45, -0.6, 45, 'fence');
// tenement row, left
const segs = [{ z0: -5, z1: 12, top: 14.4, tint: [1.0, 0.96, 0.88] }, { z0: 12, z1: 22, top: 10.4, tint: [0.84, 0.92, 1.0] },
              { z0: 22, z1: 34, top: 16.4, tint: [1.05, 0.9, 0.8] }, { z0: 34, z1: 62, top: 8.4, tint: [0.9, 0.92, 0.85] }];
for (const s of segs) box(-20, WALK, s.z0, -6.0, s.top, s.z1, 'facade', { seg: s });
box(-6.0, 1.9, 9.55, -5.25, 2.65, 9.7, 'cross');                                 // pharmacy cross sign, sticking out
// far end of the street
for (let i = 0; i < 9; i++) {
  const x0 = -34 + i * 8 + rnd() * 2, h = 4 + rnd() * 14;
  box(x0, ROAD, 78 + rnd() * 10, x0 + 6 + rnd() * 3, h, 100, 'far');
}
box(16, WALK, 22, 30, 11, 40, 'far');                                            // block behind the lot
// utility poles (left), with crossarms + transformer
const polesL = [4, 15, 27, 40];
for (const z of polesL) {
  box(-4.78, WALK, z - 0.14, -4.5, 5.8, z + 0.14, 'pole');
  box(-5.7, 5.2, z - 0.06, -3.5, 5.32, z + 0.06, 'metal');
}
box(-5.15, 3.5, 14.8, -4.78, 4.4, 15.2, 'metal');
// sodium streetlamp (right) reaching over the road
box(1.72, WALK, 4.0, 1.96, 5.6, 4.24, 'pole');
box(-1.5, 5.36, 4.06, 1.8, 5.46, 4.18, 'metal');                                // long arm out over the middle of the road
box(-1.75, 5.2, 4.0, -1.28, 5.34, 4.24, 'lamphead', { g: 'sodium' });
// far mercury lamp (left)
box(-3.6, 5.3, 26.9, -4.5, 5.4, 27.05, 'metal');
box(-3.9, 5.1, 26.8, -3.2, 5.32, 27.15, 'lamphead', { g: 'mercury' });
// traffic light
box(1.85, WALK, 16.0, 2.05, 3.3, 16.2, 'metal');
box(1.72, 2.0, 15.78, 2.18, 3.25, 15.98, 'tlight');
// jeepney waiting shed + stop sign
for (const [x, z] of [[2.6, 5.2], [4.35, 5.2], [2.6, 8.0], [4.35, 8.0]]) box(x, WALK, z, x + 0.08, 1.1, z + 0.08, 'metal');
box(2.35, 1.1, 4.95, 4.75, 1.22, 8.3, 'roof');
box(4.36, -0.7, 5.2, 4.44, 0.9, 8.08, 'panel');
box(3.65, -1.05, 5.6, 4.3, -0.98, 7.6, 'metal');
box(2.42, WALK, 4.62, 2.5, 3.0, 4.7, 'metal');
box(2.0, 2.0, 4.55, 2.95, 3.05, 4.62, 'stopsign');

// ---------- ray / box ----------
function hitBox(o, d, b) {
  let tmin = -Infinity, tmax = Infinity, axis = -1, sign = 0;
  for (let a = 0; a < 3; a++) {
    if (Math.abs(d[a]) < 1e-9) { if (o[a] < b.lo[a] || o[a] > b.hi[a]) return null; continue; }
    let t1 = (b.lo[a] - o[a]) / d[a], t2 = (b.hi[a] - o[a]) / d[a], s = -1;
    if (t1 > t2) { const k = t1; t1 = t2; t2 = k; s = 1; }
    if (t1 > tmin) { tmin = t1; axis = a; sign = s; }
    if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return null;
  }
  if (tmin < 1e-4) return null;
  return { t: tmin, axis, sign };
}
function trace(o, d, maxT = Infinity) {
  let best = null;
  for (const b of boxes) {
    const h = hitBox(o, d, b);
    if (h && h.t < maxT && (!best || h.t < best.t)) { best = h; best.b = b; }
  }
  return best;
}

// ---------- lights (contribution + shadows baked once; only intensity animates) ----------
const LIGHTS = [
  { p: [-1.5, 5.0, 4.1], c: [1.0, 0.52, 0.24], s: 2.8, k: 16, g: 'sodium' },
  { p: [-3.55, 5.0, 26.95], c: [0.62, 0.8, 1.0], s: 3.2, k: 24, g: 'mercury' },
  { p: [-5.3, -0.3, 3.5], c: [0.22, 0.95, 0.52], s: 0.9, k: 3, g: 'pharm' },
  { p: [-5.3, -0.3, 6.0], c: [0.22, 0.95, 0.52], s: 0.9, k: 3, g: 'pharm' },
  { p: [-5.3, -0.3, 8.4], c: [0.22, 0.95, 0.52], s: 0.9, k: 3, g: 'pharm' },
  { p: [-5.3, 0.3, 14.2], c: [1.0, 0.66, 0.34], s: 0.8, k: 2.5, g: 'sari' },
  { p: [-5.3, -0.2, 25.5], c: [0.95, 0.85, 0.7], s: 0.6, k: 2.5, g: 'carinderia' },
];

const NP = W * H;
const kind = new Uint8Array(NP);                       // 0 sky, 1 surface
const DIST = new Float32Array(NP).fill(1e9), NY = new Float32Array(NP), SKYV = new Float32Array(NP);
const AR = new Float32Array(NP), AG = new Float32Array(NP), AB = new Float32Array(NP);
const ER = new Float32Array(NP), EG = new Float32Array(NP), EB = new Float32Array(NP);
const EGRP = new Array(NP).fill(null);
const WET = new Float32Array(NP), PUD = new Float32Array(NP);   // damp sheen, standing puddles
const REF = new Int32Array(NP).fill(-1), RIM = new Uint8Array(NP);                          // puddle mirror: screen pixel it reflects (-1 = sky)
const CONTRIB = LIGHTS.map(() => new Float32Array(NP)), SPEC = LIGHTS.map(() => new Float32Array(NP));

let A, E, Eg;                                            // scratch for material output
const setA = (r, g, b) => { A = [r, g, b]; };
const setE = (r, g, b, grp) => { E = [r, g, b]; Eg = grp; };

const winGroups = new Map();
function windowGroup(key) {
  if (!winGroups.has(key)) {
    const r = hash(key[0], key[1], 77);
    winGroups.set(key, r > 0.78 ? 'warm' + (key[0] * 7 + key[1]) % 5 : r > 0.72 ? 'tv' : r > 0.66 ? 'cool' : null);
  }
  return winGroups.get(key);
}

const JEEP = ['..######..', '.#......#.', '##########', '#.##..##.#', '##########', '.##....##.'];

function material(b, P, n) {
  A = [0.4, 0.4, 0.4]; E = null; Eg = null;
  const [x, y, z] = P, dist = Math.hypot(x - CAMX, y, z);
  switch (b.mat) {
    case 'road': {
      let a = 0.2 * (0.8 + 0.4 * vnoise(x * 1.5, z * 1.5, 1));
      let r = a, g = a, bl = a * 1.05;
      if (Math.abs(x + 1.5) < 0.07 && fr(z / 4) < 0.5 && vnoise(z * 2, 1, 3) > 0.45) { r += 0.12; g += 0.1; bl += 0.04; }   // worn centre dashes
      if (Math.abs(x + 4.3) < 0.06 || Math.abs(x - 1.3) < 0.06) { r = g = bl = 0.55; }
      if (z > 2.8 && z < 5.2 && x > -4.4 && x < 1.4 && fr((x + 4.5) / 0.75) < 0.5) {                        // worn crosswalk
        const worn = vnoise(x * 3, z * 3, 2);
        if (worn > 0.3) { r = g = 0.58; bl = 0.6; }
      }
      if (Math.hypot(x + 2.6, z - 11) < 0.35) { r = g = bl = 0.12; }                                        // manhole
      A = [r, g, bl];
      WET.cur = clamp((vnoise(x * 0.5, z * 0.3, 21) - 0.55) * 5, 0, 1);
      // puddles: potholes in the lane + water pooling along both gutters
      const gutter = Math.exp(-(((x - 1.2) / 0.22) ** 2)) + Math.exp(-(((x + 4.2) / 0.22) ** 2));
      PUD.cur = clamp((vnoise(x * 1.0, z * 0.6, 25) + 0.22 * gutter * vnoise(z * 0.8, 3, 27) - 0.74) * 25, 0, 1);
      // placed pools: one under the streetlamp's mirror line, one catching the pharmacy glow, a couple down the lane
      for (const [px, pz, rx, rz] of [[-1.6, 1.42, 0.75, 0.28], [-3.7, 5.6, 0.6, 1.3], [-0.4, 9.5, 0.9, 1.4], [1.15, 11.6, 0.45, 1.8]]) {
        const e = ((x - px) / rx) ** 2 + ((z - pz) / rz) ** 2 + (vnoise(x * 3, z * 3, 28) - 0.5) * 0.7;
        PUD.cur = Math.max(PUD.cur, clamp((1 - e) * 12, 0, 1));
      }
      break;
    }
    case 'walk': {
      if (n[1] < 0.5) {                                                                                    // curb face: painted
        const yb = fr(z / 1.2) < 0.5;
        A = yb ? [0.75, 0.62, 0.2] : [0.14, 0.14, 0.14]; break;
      }
      const tx = Math.floor(x / 0.45), tz = Math.floor(z / 0.45);
      let a = 0.42 * (0.82 + 0.3 * hash(tx, tz, 3));
      if (dist < 12 && (fr(x / 0.45) < 0.08 || fr(z / 0.45) < 0.08)) a *= 0.7;
      A = b.side === 'R' ? [a * 1.05, a * 1.05, a * 0.62] : [a, a * 0.98, a * 0.95];
      WET.cur = clamp((vnoise(x * 0.8, z * 0.5, 22) - 0.6) * 5, 0, 1);
      PUD.cur = clamp((vnoise(x * 1.4, z * 1.0, 26) - 0.76) * 25, 0, 1);         // sunken tiles holding water
      break;
    }
    case 'lot': { const a = 0.14 + 0.08 * vnoise(x, z, 4); A = [a * 0.8, a, a * 0.7]; break; }
    case 'fence': { const a = 0.38 * (0.8 + 0.3 * vnoise(z * 2, y * 3, 5)); A = [a, a * 0.98, a * 0.92];
      if (vnoise(z * 1.5, y * 4, 6) > 0.72) A = [0.5, 0.25, 0.3]; break; }                                  // graffiti scraps
    case 'pole': { const a = 0.42 * (0.9 + 0.2 * hash(0, Math.floor(y * 3), 7)); A = [a, a, a * 0.98];
      if (y < -0.4) A = [a * 0.8, a * 0.8, a * 0.8]; break; }
    case 'metal': A = [0.2, 0.24, 0.22]; break;
    case 'roof': A = fr(x / 0.18) < 0.5 ? [0.42, 0.46, 0.44] : [0.32, 0.36, 0.34]; break;
    case 'panel': A = [0.12, 0.16, 0.18]; if (n[0] < -0.5) setE(0.1, 0.16, 0.2, 'adpanel'); break;
    case 'lamphead': A = [0.15, 0.15, 0.15]; if (n[1] < -0.5) setE(1.0, 0.85, 0.6, b.g); break;
    case 'tlight': {
      A = [0.08, 0.09, 0.08];
      if (n[2] < -0.5) {
        for (const [yy, grp, col] of [[2.95, 'tl_r', [1, 0.22, 0.15]], [2.62, 'tl_a', [1, 0.7, 0.2]], [2.29, 'tl_g', [0.3, 1, 0.55]]])
          if (Math.hypot(x - 1.95, y - yy) < 0.13) { A = [0.15, 0.15, 0.15]; setE(...col, grp); }
      }
      break;
    }
    case 'stopsign': {
      A = [0.75, 0.75, 0.72];
      if (n[2] < -0.5) {
        const u = (x - 2.0) / 0.95, v = 1 - (y - 2.0) / 1.05;
        A = [0.2, 0.32, 0.6];
        if (u > 0.06 && u < 0.94 && v > 0.06 && v < 0.94) {
          const col = Math.floor((u - 0.1) / 0.8 * 10), row = Math.floor((v - 0.3) / 0.45 * 6);
          if (row >= 0 && row < 6 && col >= 0 && col < 10 && JEEP[row][col] === '#') A = [0.85, 0.86, 0.82];
          if (v < 0.22 && v > 0.1 && u > 0.2 && u < 0.8 && fr(u * 7) < 0.6) A = [0.85, 0.86, 0.82];          // "PARA" lettering
        } else A = [0.8, 0.8, 0.76];
      }
      break;
    }
    case 'cross': {
      A = [0.1, 0.25, 0.16];
      if (Math.abs(n[2]) > 0.5) {
        const u = (x + 5.625) / 0.75, v = (y - 2.275) / 0.75;
        if ((Math.abs(u) < 0.09 && Math.abs(v) < 0.3) || (Math.abs(v) < 0.09 && Math.abs(u) < 0.3)) setE(0.75, 1.0, 0.8, 'cross');
        else setE(0.1, 0.55, 0.3, 'cross');
      }
      break;
    }
    case 'far': {
      A = [0.05, 0.06, 0.06];
      const wx = Math.floor((n[2] !== 0 ? x : z) / 1.6), wy = Math.floor(y / 2.2);
      if (fr((n[2] !== 0 ? x : z) / 1.6) > 0.35 && fr(y / 2.2) > 0.4 && hash(wx, wy, 33 + (b.lo[0] | 0)) > 0.86) setE(0.5, 0.36, 0.2, 'farwin');
      break;
    }
    case 'facade': facade(b, x, y, z, n, dist); break;
  }
}

function facade(b, x, y, z, n, dist) {
  const t = b.seg.tint, v = y + EYE, u = n[0] > 0.5 ? z : x;
  let a = 0.52 * (0.85 + 0.3 * vnoise(u * 0.6, v * 0.4, 8));
  if (vnoise(u * 4, v * 0.35, 9) > 0.7) a *= 0.8;                                    // rust/rain streaks
  A = [a * t[0], a * t[1], a * t[2]];
  if (n[0] < 0.5) return;                                                           // side walls stay plain
  const lv = (v - 3.4) % 3.2;
  if (v > 3.4 && lv < 0.18) A = A.map(c => c * 1.3);                                // floor ledges
  if (v > 3.4 && lv > 3.0) A = A.map(c => c * 0.6);
  if (v > 3.4) {
    const k = Math.floor((u - 0.5) / 3.0), wu = fr((u - 0.5) / 3.0) * 3.0, fl = Math.floor((v - 3.4) / 3.2);
    if (wu > 0.7 && wu < 2.3 && lv > 0.9 && lv < 2.5) {
      const slat = fr(lv / 0.2) < 0.3, mull = Math.abs(wu - 1.5) < 0.06;
      const grp = windowGroup([k + 40, fl]);
      if (slat || mull) { A = [0.3, 0.32, 0.32]; return; }
      A = [0.04, 0.05, 0.06];
      if (grp) {
        const col = grp === 'tv' ? [0.25, 0.42, 0.8] : grp === 'cool' ? [0.55, 0.72, 0.75] : [0.85, 0.6, 0.32];
        setE(...col, grp);
      }
      return;
    }
    if (wu > 0.9 && wu < 2.1 && lv > 0.35 && lv < 0.85 && hash(k, fl, 12) > 0.6) {    // aircon unit under the window
      A = fr(wu * 8) < 0.4 && lv > 0.45 && lv < 0.75 ? [0.3, 0.3, 0.3] : [0.68, 0.68, 0.64]; return;
    }
    return;
  }
  // ground floor shops
  if (u > 2 && u < 9) {                                                             // pharmacy
    if (v > 2.7 && v < 3.3) { A = [0.15, 0.45, 0.28]; if (v > 2.85 && v < 3.15 && u > 2.6 && u < 8.4 && fr(u / 0.32) < 0.55) setE(0.55, 0.9, 0.65, 'pharm'); return; }
    if (v > 0.2 && v < 2.6) {
      if (fr((u - 2) / 1.4) < 0.05 || v < 0.3 || v > 2.5) { A = [0.6, 0.62, 0.6]; return; }
      A = [0.05, 0.1, 0.08];
      const shelf = fr(v / 0.45) < 0.25 && v < 2.0;
      setE(shelf ? 0.25 : 0.12, shelf ? 0.75 : 0.62, shelf ? 0.45 : 0.36, 'pharm');
      return;
    }
  }
  if (u > 12.5 && u < 16) {                                                         // sari-sari store
    if (v > 0.9 && v < 2.3) {
      if (fr(u / 0.22) < 0.3 || fr(v / 0.28) < 0.2) { A = [0.22, 0.24, 0.22]; return; }
      A = [0.08, 0.06, 0.04];
      const goods = hash(Math.floor(u / 0.25), Math.floor(v / 0.2), 13);
      setE(0.6 * (0.6 + goods * 0.5), 0.42 * (0.6 + goods * 0.4), 0.22, 'sari');
      return;
    }
    if (v > 2.4 && v < 2.9) { A = [0.65, 0.3, 0.22]; if (fr(u / 0.3) < 0.5 && v > 2.5 && v < 2.8) A = [0.85, 0.8, 0.6]; return; }
  }
  if ((u > 17 && u < 21.4) || (u > 28 && u < 33) || (u > 35 && u < 45)) {          // rolling steel shutters
    if (v < 2.6) { const rib = fr(v / 0.13) < 0.5 ? 0.46 : 0.34; A = [rib, rib * 1.02, rib * 1.05]; return; }
  }
  if (u > 23.5 && u < 27.5 && v > 0.2 && v < 2.5) {                                // carinderia, still open
    A = [0.08, 0.07, 0.06];
    setE(0.7, 0.62, 0.48, 'carinderia');
    if (fr(u / 1.0) < 0.06) A = [0.3, 0.3, 0.3], E = null;
    return;
  }
  if (u > 9.6 && u < 11.2 && v < 2.3) { A = [0.22, 0.17, 0.14]; return; }           // stair door
}

// bake primary rays, shadows, sky visibility
const SKYDIRS = [[0, 1, 0], [0.5, 0.8, 0.3], [-0.5, 0.8, -0.2], [0.2, 0.7, -0.6], [-0.3, 0.75, 0.5]].map(d => { const l = Math.hypot(...d); return d.map(c => c / l); });
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  const d = [(x + 0.5 - CX) / F, -(y + 0.5 - CY) / F, 1];
  const h = trace([CAMX, 0, 0], d);
  if (!h) continue;
  const P = d.map((c, a) => c * h.t + (a === 0 ? CAMX : 0)), n = [0, 0, 0]; n[h.axis] = h.sign;
  kind[i] = 1; DIST[i] = h.t * Math.hypot(...d); NY[i] = n[1];
  WET.cur = 0; PUD.cur = 0;
  material(h.b, P, n);
  AR[i] = A[0]; AG[i] = A[1]; AB[i] = A[2];
  if (E) { ER[i] = E[0]; EG[i] = E[1]; EB[i] = E[2]; EGRP[i] = Eg; }
  WET[i] = WET.cur; PUD[i] = n[1] > 0.5 ? PUD.cur : 0;
  if (PUD[i] > 0) {                                     // mirror about the horizon: the pixel-art puddle cheat
    const yr = 2 * CY - y - 2;
    if (yr >= 0 && yr < y) REF[i] = yr * W + x;
  }

  const o = P.map((c, a) => c + n[a] * 0.02);
  let sv = 0;
  for (const sd of SKYDIRS) if (sd[0] * n[0] + sd[1] * n[1] + sd[2] * n[2] > -0.2 && !trace(o, sd, 80)) sv++;
  SKYV[i] = sv / SKYDIRS.length;
  const Pc = [P[0] - CAMX, P[1], P[2]], dl = Math.hypot(...Pc), V = Pc.map(c => c / dl), R = [V[0] - 2 * n[0] * (V[0] * n[0] + V[1] * n[1] + V[2] * n[2]),
    V[1] - 2 * n[1] * (V[0] * n[0] + V[1] * n[1] + V[2] * n[2]), V[2] - 2 * n[2] * (V[0] * n[0] + V[1] * n[1] + V[2] * n[2])];
  LIGHTS.forEach((L, li) => {
    const l = L.p.map((c, a) => c - P[a]), ld = Math.hypot(...l), ln = l.map(c => c / ld);
    const ndl = ln[0] * n[0] + ln[1] * n[1] + ln[2] * n[2];
    if (ndl <= 0) return;
    if (trace(o, ln, ld - 0.3)) return;
    CONTRIB[li][i] = ndl * L.s / (1 + ld * ld / L.k);
    if (n[1] > 0.5) {                                   // wet-road reflections stretch into streaks toward the viewer
      const ah = Math.atan2(R[0], R[2]) - Math.atan2(ln[0], ln[2]), av = Math.asin(clamp(R[1], -1, 1)) - Math.asin(clamp(ln[1], -1, 1));
      SPEC[li][i] = Math.exp(-((ah / 0.035) ** 2) - ((av / 0.16) ** 2)) * L.s * 0.3;
    }
  });
}

// ---------- animated intensities ----------
function groupI(g, T, wet) {
  if (!g) return 0;
  const day = !NIGHT;
  switch (g) {
    case 'sodium': { if (day) return 0; let I = 1 + 0.04 * Math.sin(T * 17) + 0.03 * Math.sin(T * 41);
      if (hash(Math.floor(T * 12), 0, 40) > 0.98) I *= 0.5; return I; }
    case 'mercury': { if (day) return 0;                                       // a dying lamp: buzz, cut out, catch again
      const b = Math.floor(T * 7); const dead = hash(Math.floor(T * 0.35), 1, 41) > 0.6 && hash(b, 2, 42) > 0.45;
      return dead ? 0.12 : 0.9 + 0.1 * Math.sin(T * 50); }
    case 'pharm': return (day ? 0.4 : 1) * (hash(Math.floor(T * 10), 3, 43) > 0.985 ? 0.6 : 1);
    case 'cross': { const s = hash(Math.floor(T * 9), 4, 44); return (day ? 0.75 : 1) * (s > 0.95 ? 0.25 : s > 0.9 ? 0.7 : 1); }
    case 'sari': return (day ? 0.25 : 0.85) + 0.1 * Math.sin(T * 2.3) - (hash(Math.floor(T * 14), 5, 45) > 0.97 ? 0.4 : 0);
    case 'carinderia': return (day ? 0.3 : 0.9) + 0.05 * Math.sin(T * 1.7);
    case 'adpanel': return day ? 0 : 0.8;
    case 'farwin': return day ? 0.15 : 0.8;
    case 'tl_r': case 'tl_a': case 'tl_g': {
      const c = T % 14.5, on = c < 6 ? 'tl_g' : c < 7.5 ? 'tl_a' : 'tl_r';
      return g === on ? 1.2 : 0.06;
    }
    case 'tv': return (day ? 0.15 : 0.55) * (0.4 + 0.6 * hash(Math.floor(T * 5), 6, 46));
    case 'cool': return day ? 0.1 : 0.5;
    default: {                                                                   // warm windows, each its own rhythm
      const ph = g.charCodeAt(4) || 0;
      return (day ? 0.12 : 0.65) * (0.85 + 0.15 * Math.sin(T * 0.5 + ph)) * (hash(Math.floor(T * 0.2 + ph), 7, 47 + ph) > 0.9 ? 0.2 : 1);
    }
  }
}

// ---------- overlays ----------
const R = new Float32Array(NP), G = new Float32Array(NP), B = new Float32Array(NP);
const project = (x, y, z) => [CX + (x - CAMX) * F / z - 0.5, CY - y * F / z - 0.5];
function plot(x, y, r, g, b, depth = 0) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x;
  if (depth && DIST[i] < depth) return;
  R[i] = r; G[i] = g; B[i] = b;
}
function add(x, y, r, g, b) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x; R[i] += r; G[i] += g; B[i] += b;
}

const wires = [];
const top = (z, side) => side ? [-5.6, 5.26, z] : [-3.6, 5.26, z];
for (let k = 0; k < polesL.length - 1; k++) for (const s of [0, 1]) wires.push({ a: top(polesL[k], s), b: top(polesL[k + 1], s), sag: 0.5 + 0.3 * s });
wires.push({ a: [-5.5, 5.3, 4], b: [1.84, 5.0, 4.1], sag: 0.6 }, { a: [-3.6, 5.3, 15], b: [1.95, 3.3, 16.1], sag: 0.5 },
           { a: [-5.0, 4.4, 15], b: [-6.0, 4.0, 18], sag: 0.3 }, { a: [-5.0, 4.2, 15], b: [-6.0, 3.6, 13], sag: 0.25 },
           { a: [-3.6, 5.26, 4], b: [-6.0, 3.8, 1.5], sag: 0.3 }, { a: [-5.6, 5.26, 27], b: [-6.0, 4.0, 24], sag: 0.2 },
           { a: [-3.6, 5.26, 15], b: [1.84, 5.2, 4.1], sag: 0.9 }, { a: [1.84, 5.4, 4.1], b: [9, 6.5, 13], sag: 0.6 },
           { a: [-3.6, 5.26, 27], b: [12, 7.0, 30], sag: 1.2 });
// coiled cable bundles hanging off the poles (very Tondo)
const coils = [[-4.9, 4.7, 4], [-4.4, 4.5, 27]];

let cid = 1;
const trees = [
  { trunk: [7.2, 9], h: 6.5, cl: [[7.2, 6.6, 9, 2.2], [6.0, 5.6, 8.6, 1.7], [8.4, 5.8, 9.4, 1.8], [7.0, 4.6, 8.2, 1.5], [8.0, 7.6, 10, 1.6]] },
  { trunk: [10, 16], h: 7, cl: [[10, 7, 16, 2.4], [8.6, 6, 15.4, 1.8], [11.4, 6.2, 16.6, 1.9], [9.5, 8.4, 16, 1.7]] },
  { trunk: [7.5, 22], h: 6, cl: [[7.5, 6.4, 22, 2.2], [6.4, 5.6, 21.4, 1.6], [8.6, 5.4, 22.8, 1.7]] },
  { trunk: [5.9, 4.0], h: 9, cl: [[5.4, 7.6, 4.6, 1.6], [4.4, 6.6, 4.2, 1.3], [6.4, 8.8, 4.8, 1.5], [3.8, 8.2, 4.0, 1.2], [5.2, 9.4, 4.2, 1.4]] },
  { trunk: [9, 30], h: 6.5, cl: [[9, 6.6, 30, 2.3], [7.8, 5.8, 29.5, 1.8]] },
].map(t => ({ ...t, cl: t.cl.map(([x, y, z, r]) => ({ x, y, z, r, ph: rnd() * 6.28, id: cid++ })) }));

const rain = Array.from({ length: 70 }, () => ({ x: rnd() * (W + 30), y: rnd() * H, v: 150 + rnd() * 70, z: rnd() }));
const drops = Array.from({ length: 36 }, () => ({ x: rnd() * W, y: rnd() * H, v: 9 + rnd() * 7 }));
const moths = Array.from({ length: 3 }, () => ({ r: 2 + rnd() * 3, sp: 1.5 + rnd() * 2, ph: rnd() * 6 }));

function lightAtPoint(x, y, z, T) {
  // cheap unshadowed light estimate for moving things (foliage, cat)
  let r = 0, g = 0, b = 0;
  for (const L of LIGHTS) {
    const I = groupI(L.g, T); if (!I) continue;
    const d2 = (L.p[0] - x) ** 2 + (L.p[1] - y) ** 2 + (L.p[2] - z) ** 2;
    const s = I * L.s / (1 + d2 / L.k) * 0.22;
    r += L.c[0] * s; g += L.c[1] * s; b += L.c[2] * s;
  }
  return [r, g, b];
}

function draw(T, wet) {
  const amb = NIGHT ? (wet ? [0.11, 0.14, 0.23] : [0.13, 0.16, 0.27]) : (wet ? [0.7, 0.8, 0.76] : [0.82, 0.92, 0.88]);
  const fogC = NIGHT ? [0.03, 0.06, 0.07] : [0.4, 0.49, 0.45];
  const fogK = NIGHT ? (wet ? 30 : 45) : 26;
  const LI = LIGHTS.map(L => groupI(L.g, T, wet));
  const gcache = new Map();
  const gi = g => { if (!gcache.has(g)) gcache.set(g, groupI(g, T, wet)); return gcache.get(g); };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    let r, g, b;
    if (!kind[i]) {
      const t = y / CY;
      if (NIGHT) {
        r = 0.02 + 0.05 * t; g = 0.035 + 0.07 * t; b = 0.04 + 0.07 * t;
        const cl = vnoise(x * 0.05 - T * 0.04, y * 0.1, 30);
        const c = wet ? 0.5 : clamp((cl - 0.5) * 2, 0, 0.6);
        r += 0.02 * c; g += 0.03 * c; b += 0.03 * c;
      } else {
        r = 0.38 + 0.03 * t; g = 0.47 + 0.03 * t; b = 0.43 + 0.03 * t;
        const cl = 0.03 * (vnoise(x * 0.05 - T * 0.02, y * 0.04, 31) - 0.5);
        r += cl; g += cl; b += cl;
      }
    } else {
      const up = 0.55 + 0.45 * Math.max(0, NY[i]);
      const sv = NIGHT ? 0.5 + 0.5 * SKYV[i] : SKYV[i] * 0.85 + 0.15;
      let lr = amb[0] * sv * up, lg = amb[1] * sv * up, lb = amb[2] * sv * up;
      const pud = NIGHT ? PUD[i] : 0;
      const w = wet ? Math.max(0.3 + 0.25 * WET[i], pud) : Math.max(WET[i] * 0.7, pud * 0.85);
      // puddle reflections shimmer sideways a pixel when the surface is disturbed
      const j = pud > 0 ? i + Math.round(Math.sin(y * 1.4 + x * 0.3 + T * (wet ? 5 : 1.2)) * (wet ? 0.8 : 0.45)) : i;
      let sr = 0, sg = 0, sb = 0;
      for (let l = 0; l < LIGHTS.length; l++) {
        const I = LI[l]; if (!I) continue;
        const c = CONTRIB[l][i] * I, L = LIGHTS[l].c;
        lr += L[0] * c; lg += L[1] * c; lb += L[2] * c;
        const s = SPEC[l][j] * I * w * (1 + pud);
        if (s) { sr += L[0] * s; sg += L[1] * s; sb += L[2] * s; }
      }
      const darken = NY[i] > 0.5 ? 1 - 0.3 * w - 0.25 * pud : 1;
      r = AR[i] * lr * darken + sr + 0.018 * pud; g = AG[i] * lg * darken + sg + 0.03 * pud; b = AB[i] * lb * darken + sb + 0.04 * pud;
      if (EGRP[i]) { const f = gi(EGRP[i]); r += ER[i] * f; g += EG[i] * f; b += EB[i] * f; }
      const f = 1 - Math.exp(-DIST[i] / fogK);
      r += (fogC[0] - r) * f; g += (fogC[1] - g) * f; b += (fogC[2] - b) * f;
      if (pud > 0) {
        let ri = REF[i];
        if (ri >= 0 && wet) ri += Math.round(Math.sin(y * 1.9 + T * 6 + x * 0.2) * 0.9);   // rain-broken mirror
        const rc = ri >= 0 && ri < i ? [R[ri], G[ri], B[ri]] : [0.07, 0.1, 0.11];
        const m = pud * 0.8;
        r += (rc[0] * 0.8 + 0.008 - r) * m; g += (rc[1] * 0.85 + 0.014 - g) * m; b += (rc[2] * 0.9 + 0.02 - b) * m;
        if (RIM[i]) { r += 0.05; g += 0.065; b += 0.07; }
      }
    }
    R[i] = r; G[i] = g; B[i] = b;
  }

  const shade = (x, y, z, base) => {                       // colour for a moving object at (x,y,z)
    const d = Math.hypot(x - CAMX, y, z), f = 1 - Math.exp(-d / fogK);
    let c;
    if (NIGHT) { const l = lightAtPoint(x, y, z, T); c = [base[0] * (amb[0] + l[0]), base[1] * (amb[1] + l[1]), base[2] * (amb[2] + l[2])]; }
    else c = [base[0] * amb[0], base[1] * amb[1], base[2] * amb[2]];
    return c.map((v, k) => v + (fogC[k] - v) * f);
  };

  // trees in the lot (behind the fence), rustling
  for (const t of trees) {
    const [tx, ty0] = project(t.trunk[0], WALK, t.trunk[1]), [, ty1] = project(t.trunk[0], t.h - 2.5, t.trunk[1]);
    const tc = shade(t.trunk[0], 0, t.trunk[1], [0.25, 0.22, 0.2]);
    const tw = Math.max(1, Math.round(0.35 * F / t.trunk[1]));
    for (let y = Math.round(ty1); y <= Math.round(ty0); y++) for (let k = 0; k < tw; k++) plot(tx + k, y, ...tc, Math.hypot(t.trunk[0] - CAMX, 0, t.trunk[1]));
    for (const c of t.cl) {
      const [cx, cy] = project(c.x, c.y, c.z), rp = c.r * F / c.z, dep = Math.hypot(c.x - CAMX, c.y, c.z);
      const ox = Math.round(Math.sin(T * 0.9 + c.ph) * 0.9 + Math.sin(T * 0.37 + c.ph * 2) * 0.4);
      const oy = Math.round(Math.sin(T * 0.7 + c.ph) * 0.3);
      const rustle = Math.floor(T * 2.5 + c.ph * 10);
      const top = shade(c.x, c.y + c.r * 0.6, c.z, [0.3, 0.42, 0.3]), bot = shade(c.x, c.y - c.r * 0.8, c.z, [0.2, 0.3, 0.22]);
      const R2 = Math.ceil(rp) + 2;
      for (let dy = -R2; dy <= R2; dy++) for (let dx = -R2; dx <= R2; dx++) {
        const dd = Math.hypot(dx, dy * 1.1);
        const edge = rp + (vnoise(dx * 0.4, dy * 0.4, c.id) - 0.5) * rp * 0.5 + (hash(dx, dy, c.id * 31 + rustle) - 0.5) * 0.9;
        if (dd > edge) continue;
        if (dd > rp * 0.5 && hash(dx, dy, c.id + 99) > 0.94) continue;
        const q = clamp(0.5 + dy / (2 * rp), 0, 1), sp = hash(dx, dy, c.id + 5) > 0.82 ? 1.25 : 1;
        plot(cx + dx + ox, cy + dy + oy, (top[0] + (bot[0] - top[0]) * q) * sp, (top[1] + (bot[1] - top[1]) * q) * sp, (top[2] + (bot[2] - top[2]) * q) * sp, dep);
      }
    }
  }

  // power lines, swaying
  const wc = NIGHT ? [0.01, 0.015, 0.015] : [0.16, 0.2, 0.18];
  wires.forEach((w, j) => {
    const sway = 0.07 * Math.sin(T * 0.7 + j * 1.3);
    for (let s = 0; s <= 1; s += 0.003) {
      const x = w.a[0] + (w.b[0] - w.a[0]) * s, z = w.a[2] + (w.b[2] - w.a[2]) * s;
      const y = w.a[1] + (w.b[1] - w.a[1]) * s - (w.sag + sway) * 4 * s * (1 - s);
      const [sx, sy] = project(x, y, z), d = Math.hypot(x - CAMX, y, z), f = NIGHT ? 0 : 1 - Math.exp(-d / fogK);
      plot(sx, sy, wc[0] + (fogC[0] - wc[0]) * f, wc[1] + (fogC[1] - wc[1]) * f, wc[2] + (fogC[2] - wc[2]) * f, d);
    }
  });
  for (const [x, y, z] of coils) {
    const [sx, sy] = project(x, y, z), rr = Math.max(1.5, 0.35 * F / z);
    for (let a = 0; a < 6.28; a += 0.2) plot(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr * 0.7, ...wc, Math.hypot(x - CAMX, y, z));
  }

  // the stray cat by the pharmacy, tail flicking
  { const [cx, cy] = project(-5.35, WALK, 4.9);
    const body = shade(-5.35, -1.2, 4.9, [0.12, 0.12, 0.12]).map(v => v * 0.5);
    const px = [[0, 0], [1, 0], [2, 0], [0, -1], [1, -1], [2, -1], [1, -2], [2, -2], [1, -3], [2, -3], [1, -4], [3, -4], [2, -3]];
    for (const [dx, dy] of px) plot(cx + dx, cy + dy, ...body);
    const flick = hash(Math.floor(T * 1.2), 9, 90) > 0.6 ? Math.round(Math.sin(T * 9)) : 0;
    plot(cx - 1, cy, ...body); plot(cx - 2, cy - 1 + flick, ...body); plot(cx - 2, cy - 2 + flick, ...body);
    if (NIGHT && hash(Math.floor(T * 2), 10, 91) > 0.12) { plot(cx + 1, cy - 3, 0.6, 1, 0.6); plot(cx + 2, cy - 3, 0.6, 1, 0.6); }
  }

  // lamp glows + moths
  for (const [g, p, col, rad] of [['sodium', [-1.52, 5.16, 4.12], [1, 0.6, 0.3], 12], ['mercury', [-3.55, 5.08, 26.95], [0.6, 0.8, 1], 7]]) {
    const I = groupI(g, T); if (!I) continue;
    const [lx, ly] = project(...p), rr = wet ? rad * 1.3 : rad;
    for (let y = -rr; y <= rr; y++) for (let x = -rr; x <= rr; x++) {
      const d = Math.hypot(x, y * 0.9); if (d > rr || y < -1) continue;
      const k = Math.pow(1 - d / rr, 2.2) * 0.45 * I;
      add(lx + x, ly + y, col[0] * k, col[1] * k, col[2] * k);
    }
    // the same glow, mirrored into any puddle underneath it
    for (let y = -rr; y <= rr; y++) for (let x = -rr; x <= rr; x++) {
      const px = Math.round(lx + x), py = Math.round(2 * CY - ly - 2 + y);
      if (px < 0 || py < 0 || px >= W || py >= H || PUD[py * W + px] < 0.5) continue;
      const d = Math.hypot(x, y * 0.9); if (d > rr) continue;
      const k = Math.pow(1 - d / rr, 2.2) * 0.3 * I;
      add(px, py, col[0] * k, col[1] * k, col[2] * k);
    }
    if (g === 'sodium') for (const m of moths) {
      const a = T * m.sp + m.ph;
      plot(lx + Math.cos(a) * m.r + (hash(Math.floor(T * 8), m.ph * 9, 80) - 0.5) * 2, ly + 2 + Math.sin(a * 1.3) * m.r * 0.6, 0.9 * I, 0.6 * I, 0.3 * I);
    }
  }
  // traffic light glow halo
  for (const [g, yy, col] of [['tl_r', 2.95, [1, 0.2, 0.12]], ['tl_a', 2.62, [1, 0.65, 0.15]], ['tl_g', 2.29, [0.25, 1, 0.5]]]) {
    const I = groupI(g, T); if (I < 0.5) continue;
    const [lx, ly] = project(1.95, yy, 15.75);
    for (let y = -4; y <= 4; y++) for (let x = -4; x <= 4; x++) {
      const d = Math.hypot(x, y); if (d > 4 || d < 0.8) continue;
      const k = Math.pow(1 - d / 4, 2) * (NIGHT ? 0.35 : 0.2);
      add(lx + x, ly + y, col[0] * k, col[1] * k, col[2] * k);
    }
  }

  // day mist drifting over everything
  if (!NIGHT) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, dep = kind[i] ? clamp(DIST[i] / 30, 0.15, 1) : 1;
    const m = (0.18 * clamp((vnoise(x * 0.035 - T * 0.03, y * 0.05, 12) - 0.4) * 2.5, 0, 1)
             + 0.3 * Math.exp(-(((y - CY - 4) / 12) ** 2)) * vnoise(x * 0.07 - T * 0.06, y * 0.2, 11)) * dep;
    R[i] += (fogC[0] - R[i]) * m; G[i] += (fogC[1] - G[i]) * m; B[i] += (fogC[2] - B[i]) * m;
  }

  if (wet) {
    const sod = NIGHT ? project(-1.5, 5.08, 4.12) : null, sI = NIGHT ? groupI('sodium', T) : 0;
    for (const p of rain) {
      const near = p.z > 0.6;
      for (let s = 0; s < (near ? 4 : 2); s++) {
        const x = p.x - s * 0.35, y = p.y - s;
        let lit = 0;
        if (sod) lit = Math.max(0, 1 - Math.hypot(x - sod[0], y - sod[1]) / 34) * sI;
        const base = NIGHT ? (near ? 0.04 : 0.022) : (near ? 0.07 : 0.04);
        add(x, y, base + lit * 0.2, base * 1.15 + lit * 0.12, base * 1.3 + lit * 0.05);
      }
    }
    if (NIGHT) {
      // ripple rings spreading in the puddles
      for (const rp of ripples) {
        const q = rp.age / rp.life, rr = 0.6 + q * rp.max, k = 0.07 * (1 - q);
        for (let a = 0; a < 6.28; a += 0.5) {
          const x = Math.round(rp.x + Math.cos(a) * rr), y = Math.round(rp.y + Math.sin(a) * rr * 0.35);
          if (x < 0 || y < 0 || x >= W || y >= H || PUD[y * W + x] < 0.3) continue;
          add(x, y, k * 0.8, k, k * 1.1);
        }
      }
      // faint single-pixel splashes on the dry-ish ground
      for (let n = 0; n < 7; n++) {
        const x = Math.floor(rnd() * W), y = CY + 6 + Math.floor(rnd() * (H - CY - 6)), i = y * W + x;
        if (!kind[i] || NY[i] < 0.5 || PUD[i] > 0.3) continue;
        add(x, y, 0.045, 0.055, 0.065);
        if (rnd() < 0.25) { add(x - 1, y - 1, 0.025, 0.03, 0.035); add(x + 1, y - 1, 0.025, 0.03, 0.035); }
      }
    } else for (let n = 0; n < 24; n++) {
      const x = Math.floor(rnd() * W), y = CY + 6 + Math.floor(rnd() * (H - CY - 6)), i = y * W + x;
      if (!kind[i] || NY[i] < 0.5) continue;
      add(x, y, 0.1, 0.12, 0.14); add(x - 1, y - 1, 0.05, 0.06, 0.07); add(x + 1, y - 1, 0.05, 0.06, 0.07);
    }
  } else if (!NIGHT) {
    for (const p of drops) { const i = Math.round(p.y) * W + Math.round(p.x); if (i >= 0 && i < NP) { R[i] += (0.55 - R[i]) * 0.4; G[i] += (0.62 - G[i]) * 0.4; B[i] += (0.58 - B[i]) * 0.4; } }
  }
}

const PUDPIX = [];
for (let i = W; i < NP; i++) if (PUD[i] > 0.5 && PUD[i - W] < 0.5) RIM[i] = 1;    // far edge of each puddle catches light
for (let i = 0; i < NP; i++) if (PUD[i] > 0.6 && i / W > CY + 4) PUDPIX.push(i);
const ripples = [];
function step(dt) {
  if (opts.wet && NIGHT && PUDPIX.length) {
    let n = dt * 22;
    while (n > 0 && ripples.length < 30) {
      if (n < 1 && rnd() > n) break;
      const i = PUDPIX[Math.floor(rnd() * PUDPIX.length)], y = Math.floor(i / W);
      ripples.push({ x: i % W, y, age: 0, life: 0.45 + rnd() * 0.3, max: 1 + (y - CY) / 40 });
      n--;
    }
  }
  for (let k = ripples.length - 1; k >= 0; k--) if ((ripples[k].age += dt) > ripples[k].life) ripples.splice(k, 1);
  for (const p of rain) {
    p.y += p.v * dt * (0.6 + p.z * 0.5); p.x -= p.v * 0.35 * dt * (0.6 + p.z * 0.5);
    if (p.y > H + 4) { p.y = -4 - rnd() * 20; p.x = rnd() * (W + 40); }
  }
  for (const p of drops) { p.y += p.v * dt; p.x -= p.v * 0.18 * dt; if (p.y > H) { p.y = -2; p.x = rnd() * (W + 20); } }
}

// ---------- quantize ----------
const LUT = new Int16Array(32768).fill(-1);
function nearest(r, g, b) {
  const key = (r >> 3) << 10 | (g >> 3) << 5 | (b >> 3);
  if (LUT[key] >= 0) return LUT[key];
  let best = 0, bd = Infinity;
  for (let j = 0; j < PAL.length; j++) {
    const p = PAL[j], rm = (r + p[0]) / 2, dr = r - p[0], dg = g - p[1], db = b - p[2];
    const d = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;
    if (d < bd) { bd = d; best = j; }
  }
  return LUT[key] = best;
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H);
function blit() {
  const px = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, o = i * 4, dth = BAYER[y & 3][x & 3] * (NIGHT ? 5 : 4);
    const c = PAL[nearest(clamp(R[i] * 255 + dth, 0, 255) | 0, clamp(G[i] * 255 + dth, 0, 255) | 0, clamp(B[i] * 255 + dth, 0, 255) | 0)];
    px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

const opts = { wet: location.hash === '#rain', speed: 1, playing: true };
let T = 3, last = performance.now(), acc = 0;
const FRAME = 1 / 12;
function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (opts.playing) {
    acc += dt;
    if (acc >= FRAME) { const s = acc * opts.speed; acc = 0; T += s; step(s); draw(T, opts.wet); blit(); }
  }
  requestAnimationFrame(loop);
}
const $ = s => document.querySelector(s);
$('#rain').setAttribute('aria-pressed', opts.wet);
draw(T, opts.wet); blit();
requestAnimationFrame(loop);

$('#play').onclick = e => { opts.playing = !opts.playing; e.target.setAttribute('aria-pressed', opts.playing); e.target.textContent = opts.playing ? 'Playing' : 'Paused'; };
$('#rain').onclick = e => { opts.wet = !opts.wet; e.target.setAttribute('aria-pressed', opts.wet); };
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  opts.speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(o => o.setAttribute('aria-pressed', o === b));
});
document.querySelectorAll('[data-scale]').forEach(b => b.onclick = () => {
  $('#frame').className = 'frame' + (b.dataset.scale === 'fit' ? '' : ' ' + b.dataset.scale + (b.dataset.scale === 'x2' ? ' native' : ''));
  document.querySelectorAll('[data-scale]').forEach(o => o.setAttribute('aria-pressed', o === b));
});
window.__pauwiFrame = () => cv.toDataURL();
})();
</script>
</body>
